<mat-card>

  <mat-card-header>
    <mat-card-title>{{ data.homeTeamId }} vs {{ data.awayTeamId }}</mat-card-title>
    <mat-card-subtitle>{{ subtitle }}</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    <div class="team-row">
      <span>{{ data.homeTeamId }}</span>
      <strong>home score</strong>
    </div>
    <div class="team-row">
      <span>{{ data.awayTeamId}}</span>
      <strong>away score</strong>
    </div>
  </mat-card-content>

</mat-card>
