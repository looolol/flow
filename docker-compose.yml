services:
  db:
    image: postgres:16
    container_name: local-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  flow-shared-builder:
    build:
      context: ./flow-shared
      dockerfile: Dockerfile
    container_name: flow-shared-builder

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: backend
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/usr/src/app/backend:cached
      - backend_node_modules:/usr/src/app/backend/node_modules
    working_dir: /usr/src/app/backend

  frontend:
    build:
      context: .
      dockerfile: frontend/flow-frontend/Dockerfile
    container_name: frontend
    depends_on:
      - backend
    restart: on-failure
    env_file:
      - .env
    ports:
      - "4200:4200"
    volumes:
      - ./frontend/flow-frontend:/usr/src/app/flow-frontend:cached
      - frontend_node_modules:/usr/src/app/flow-frontend/node_modules
    working_dir: /usr/src/app/flow-frontend

volumes:
  pgdata:
  backend_node_modules:
  frontend_node_modules:
